<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Magic Mind Reader</title>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1523580494863-6f3031224c94?fit=crop&w=1200&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            backdrop-filter: blur(6px);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .welcome-box {
            background: rgba(0,0,0,0.6);
            padding: 32px 44px 28px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.45);
            display: inline-block;
            width: min(640px, 92vw);
            transition: box-shadow 0.24s ease, transform 0.24s ease;
        }
        .welcome-box:hover {
            box-shadow: 0 26px 64px rgba(69, 118, 255, 0.35);
            transform: translateY(-2px);
        }
        .hat-shell {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            width: 96px;
            height: 96px;
            max-width: 25vw;
            max-height: 25vw;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(124, 181, 255, 0.35);
            box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.14), 0 14px 28px rgba(18, 38, 80, 0.28);
            overflow: hidden;
            padding: 2px;
        }
        .joker-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        .welcome-box:hover .joker-logo-img {
            transform: scale(1.08) rotate(4deg);
        }
        .welcome-box h1 {
            margin: 0 0 14px;
            font-size: clamp(1.2rem, 3.2vw, 1.85rem);
            letter-spacing: 0.01em;
            white-space: nowrap;
        }
        .welcome-box p {
            margin: 0 0 24px;
            line-height: 1.6;
            color: #d9e1ff;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }
        .start-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 999px;
            border: none;
            background: #ff6f61;
            color: white;
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .start-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(92, 151, 255, 0.55);
            filter: drop-shadow(0 0 18px rgba(92, 151, 255, 0.45));
        }
        .start-button span {
            display: inline-flex;
            width: 24px;
            height: 24px;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.15);
            border-radius: 999px;
            font-size: 0.95rem;
        }
        /* Click Magic Animations */
        .welcome-box.magic-out {
            animation: magicFadeOut 0.55s ease-in-out forwards;
        }
        .joker-logo-img.spin-magic {
            animation: jokerSpin 0.55s ease-in-out forwards;
        }
        .start-button.pulse-click {
            animation: magicPulse 0.55s ease-in-out forwards;
        }
        @keyframes magicFadeOut {
            0% { transform: scale(1) translateY(0); opacity: 1; filter: brightness(1); }
            40% { transform: scale(1.04) translateY(-6px); opacity: 0.9; filter: brightness(1.3) drop-shadow(0 0 40px rgba(124, 181, 255, 0.8)); }
            100% { transform: scale(0.92) translateY(12px); opacity: 0; filter: brightness(0.5); }
        }
        @keyframes jokerSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.28) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
        @keyframes magicPulse {
            0% { transform: scale(1); }
            30% { transform: scale(0.92); }
            60% { transform: scale(1.15); box-shadow: 0 0 45px rgba(255, 111, 97, 0.9); }
            100% { transform: scale(1); }
        }
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 20%, #7db8ff 70%, transparent 100%);
            box-shadow: 0 0 14px rgba(125, 184, 255, 0.9);
            animation: sparkleFly 0.55s ease-out forwards;
            z-index: 9999;
        }
        @keyframes sparkleFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <div class="hat-shell">
            <img src="{{ url_for('static', filename='joker_logo.png') }}" alt="Joker Logo" class="joker-logo-img">
        </div>
        <h1>⭐ Welcome to Magic Mind Reader ⭐</h1>
        <p>Think of a card and I’ll reveal it in just three simple steps. Tap the button to begin the magic.</p>
        <a href="/start" class="start-link" style="text-decoration: none;"><button class="start-button"><span>✨</span>Start Game</button></a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.querySelector('.start-button');
            const welcomeBox = document.querySelector('.welcome-box');
            const jokerImg = document.querySelector('.joker-logo-img');
            const startLink = document.querySelector('.start-link');

            if (startLink) {
                startLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetUrl = startLink.getAttribute('href');

                    welcomeBox.classList.add('magic-out');
                    jokerImg.classList.add('spin-magic');
                    startBtn.classList.add('pulse-click');

                    const rect = startBtn.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    for (let i = 0; i < 28; i++) {
                        const particle = document.createElement('div');
                        particle.className = 'sparkle-particle';
                        const size = Math.random() * 8 + 6;
                        particle.style.width = `${size}px`;
                        particle.style.height = `${size}px`;
                        particle.style.left = `${centerX}px`;
                        particle.style.top = `${centerY}px`;

                        const angle = Math.random() * Math.PI * 2;
                        const distance = Math.random() * 140 + 40;
                        particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                        particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);

                        document.body.appendChild(particle);
                        setTimeout(() => particle.remove(), 550);
                    }

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500);
                });
            }
        });
    </script>
</body>
</html>
